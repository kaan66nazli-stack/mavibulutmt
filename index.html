<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetirFırın - Sipariş</title>
    <style>
        :root { --purple: #5d3ebc; --yellow: #ffd300; --bg: #f4f5f7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); padding: 15px; }
        header { background: var(--purple); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .card { background: white; padding: 12px; border-radius: 8px; border: 1px solid #ddd; text-align: center; }
        .card button { background: var(--purple); color: white; border: none; padding: 6px 12px; border-radius: 5px; margin-top: 8px; cursor: pointer; width: 100%; }
        .cart-box { background: white; padding: 15px; border-radius: 10px; border: 1px solid #ddd; }
        input { width: 100%; padding: 8px; margin: 5px 0 10px; border: 1px solid #ccc; border-radius: 5px; }
        .order-btn { background: #00b152; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h2>GetirFırın Sipariş</h2>
</header>

<h3>Ürünler</h3>
<div class="grid" id="product-list">Yükleniyor...</div>

<div class="cart-box">
    <h3>Sepetim</h3>
    <div id="cart-items" style="margin: 10px 0; font-size: 14px;">Sepetiniz boş.</div>
    <hr style="margin: 10px 0;"><br>
    
    <label>Ad Soyad / Daire No:</label>
    <input type="text" id="cust-name" placeholder="Örn: Ahmet - Daire 4">
    
    <label>Adres Tarifi:</label>
    <input type="text" id="cust-addr" placeholder="Örn: 2. Kat sağ daire">

    <button class="order-btn" onclick="sendOrder()">Siparişi Tamamla (<span id="total-price">0</span> TL)</button>
</div>

<script>
    // GOOGLE APPS SCRIPT'TEN ALDIĞIN LINKI BURAYA YAPIŞTIR
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbype8ZeKGKuppjSoO-_xp284Hh3bmv70et7QXnXNxPPm9yjzqTMZ9-kIQPOgNmZa4ed/exec";

    let products = [];
    let cart = [];

    // ÜRÜNLERİ GOOGLE SHEETS'TEN ÇEK
    async function loadProducts() {
        try {
            const res = await fetch(SCRIPT_URL);
            products = await res.json();
            const container = document.getElementById('product-list');
            container.innerHTML = '';

            products.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <b>${p.name}</b><br>
                        <small>${p.price} TL</small><br>
                        <small style="color:gray;">Stok: ${p.stock}</small><br>
                        <button onclick="addToCart('${p.name}', ${p.price}, ${p.stock})">Ekle</button>
                    </div>
                `;
            });
        } catch (e) {
            document.getElementById('product-list').innerText = "Ürünler yüklenirken hata oluştu.";
        }
    }

    function addToCart(name, price, stock) {
        let item = cart.find(i => i.name === name);
        if (item) {
            if (item.qty < stock) item.qty++;
            else alert("Stok sınırına ulaştınız!");
        } else {
            cart.push({ name, price, qty: 1 });
        }
        updateCart();
    }

    function updateCart() {
        const container = document.getElementById('cart-items');
        let total = 0;
        container.innerHTML = '';

        cart.forEach(i => {
            total += i.price * i.qty;
            container.innerHTML += `<div>${i.name} x${i.qty} - ${i.price * i.qty} TL</div>`;
        });

        document.getElementById('total-price').innerText = total;
    }

    // SİPARİŞİ GOOGLE SHEETS'E GÖNDER
    async function sendOrder() {
        const name = document.getElementById('cust-name').value;
        const address = document.getElementById('cust-addr').value;
        const total = document.getElementById('total-price').innerText;

        if (!name || cart.length === 0) return alert("Lütfen sepeti doldurun ve adınızı yazın.");

        const itemsStr = cart.map(i => `${i.name} (${i.qty} adet)`).join(', ');

        const orderData = {
            name: name,
            address: address,
            items: itemsStr,
            total: total
        };

        alert("Siparişiniz gönderiliyor...");

        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
        });

        alert("Siparişiniz alındı!");
        cart = [];
        updateCart();
    }

    loadProducts();
</script>

</body>
</html>
