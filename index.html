<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapında - Hızlı Sipariş</title>
    <style>
        :root {
            --primary: #5d3ebc;
            --primary-dark: #4c3298;
            --accent: #ffd300;
            --success: #00b152;
            --bg: #f5f6f9;
            --card-bg: #ffffff;
            --text: #191919;
            --text-muted: #697488;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { background: var(--bg); color: var(--text); padding-bottom: 40px; }

        /* Üst Header */
        header { background: var(--primary); color: white; padding: 18px 20px; text-align: center; box-shadow: 0 4px 12px rgba(93, 62, 188, 0.2); }
        header h1 { font-size: 26px; font-weight: 800; letter-spacing: 0.5px; }
        header p { font-size: 13px; opacity: 0.9; margin-top: 3px; }

        /* Yılbaşı Banner */
        .xmas-banner { display: none; background: #d63031; color: white; text-align: center; padding: 10px; font-weight: bold; font-size: 13px; }

        .container { max-width: 600px; margin: 15px auto; padding: 0 12px; }

        /* 1. BİLDİRİMLER ALANI (BAĞIMSIZ KART) */
        .section-box { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eef0f4; }
        
        .notifications-card { background: #fff9db; border: 1px solid #ffe066; }
        .notifications-card h3 { color: #f59f00; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .promo-code { background: #f59f00; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 12px; }

        /* 2. ÜRÜNLER ALANI */
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        
        .product-card { background: var(--card-bg); border-radius: 12px; padding: 14px; text-align: center; border: 1px solid #eef0f4; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.1s; }
        .product-card:active { transform: scale(0.98); }
        .product-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .product-price { color: var(--primary); font-size: 16px; font-weight: 800; margin-bottom: 8px; }
        .product-btn { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; }

        /* 3. SEPET VE SİPARİŞ ALANI (TAMAMEN AYRI KART) */
        .cart-card { background: var(--card-bg); border-radius: 14px; padding: 18px; border: 2px solid var(--primary); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        
        .cart-item { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px border-dashed #eee; }
        
        .form-group { margin-top: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: var(--primary); }

        .coupon-group { display: flex; gap: 8px; }
        .coupon-group input { margin-bottom: 0; }
        .coupon-btn { background: #333; color: white; border: none; padding: 0 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }

        .total-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-size: 18px; font-weight: 800; }

        .order-btn { background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 177, 82, 0.25); }
    </style>
</head>
<body>

<div id="xmas-banner" class="xmas-banner">
    🎄 Mutlu Yıllar! Yılbaşı İndirim Kodunu Kullanmayı Unutmayın! ❄️
</div>

<header>
    <h1>KAPINDA</h1>
    <p>Dakikalar İçinde Kapında</p>
</header>

<div class="container">

    <!-- BİLDİRİMLER / KAMPANYA ALANI -->
    <div class="section-box notifications-card">
        <h3>🔔 Bildirimler & Duyurular</h3>
        <div id="promo-list" style="font-size: 13px;">Yükleniyor...</div>
    </div>

    <!-- ÜRÜNLER ALANI -->
    <div class="section-title">Ürünler</div>
    <div class="products-grid" id="product-list">
        <!-- Sabit Ürünler -->
        <div class="product-card">
            <div>
                <div class="product-title">Ekmek</div>
                <div class="product-price">10 TL</div>
            </div>
            <button class="product-btn" onclick="addToCart('Ekmek', 10)">Ekle</button>
        </div>
        <div class="product-card">
            <div>
                <div class="product-title">Çikolata</div>
                <div class="product-price">35 TL</div>
            </div>
            <button class="product-btn" onclick="addToCart('Çikolata', 35)">Ekle</button>
        </div>
        <div class="product-card">
            <div>
                <div class="product-title">Kurabiye</div>
                <div class="product-price">45 TL</div>
            </div>
            <button class="product-btn" onclick="addToCart('Kurabiye', 45)">Ekle</button>
        </div>
    </div>

    <!-- SEPET VE SİPARİŞ VERME ALANI (AYRI) -->
    <div class="cart-card">
        <div class="section-title" style="margin-bottom: 8px;">Sepetim</div>
        <div id="cart-items" style="color: var(--text-muted); font-size: 13px;">Sepetiniz boş.</div>
        
        <div class="form-group" style="margin-top: 15px;">
            <label>KAMPANYA KODU</label>
            <div class="coupon-group">
                <input type="text" id="coupon-code" placeholder="Örn: GUNAYDIN">
                <button class="coupon-btn" onclick="applyCoupon()">Uygula</button>
            </div>
            <div id="coupon-msg" style="font-size: 12px; margin-top: 4px;"></div>
        </div>

        <div class="form-group">
            <label>AD SOYAD / DARE NO</label>
            <input type="text" id="cust-name" placeholder="Örn: Ahmet - Daire 4">
        </div>

        <div class="form-group">
            <label>ADRES TARİFİ</label>
            <input type="text" id="cust-addr" placeholder="Örn: 2. Kat sağ daire">
        </div>

        <div class="total-row">
            <span>Toplam:</span>
            <span style="color: var(--primary);"><span id="total-price">0</span> TL</span>
        </div>

        <button class="order-btn" onclick="sendOrder()">Siparişi Tamamla</button>
    </div>

</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/library/d/17CgapLJYXt1zkIp_MtPLrSwBoUXJ916lJn1uhhTIzQTS1tCQYBxmZxDJ/1"; // Google Apps Script URL'ini Buraya Yapıştır

    let activeCoupons = [];
    let cart = [];
    let appliedDiscount = 0;
    let appliedCouponName = "";

    function checkSeasonalEvents() {
        const month = new Date().getMonth();
        if (month === 11 || month === 0) {
            document.getElementById('xmas-banner').style.display = 'block';
        }
    }

    async function loadNotifications() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            activeCoupons = data.kampanyalar || [];
            renderNotifications();
        } catch (e) {
            renderNotifications();
        }
    }

    function renderNotifications() {
        const container = document.getElementById('promo-list');
        container.innerHTML = '';
        
        const hour = new Date().getHours();
        if (hour >= 6 && hour <= 11) {
            container.innerHTML += `<p style="margin-bottom:4px;">☀️ <b>Günaydın Kampanyası!</b> Kod: <span class="promo-code">GUNAYDIN</span> (%15 İndirim)</p>`;
        }

        const month = new Date().getMonth();
        if (month === 11 || month === 0) {
            container.innerHTML += `<p style="margin-bottom:4px;">🎄 <b>Yılbaşı Fırsatı!</b> Kod: <span class="promo-code">YILBASI</span> (%25 İndirim)</p>`;
        }

        if(activeCoupons.length > 0) {
            activeCoupons.forEach(c => {
                container.innerHTML += `<p>• <b>${c.kod}</b> Koduyla %${c.indirimOrani} İndirim!</p>`;
            });
        } else if (hour < 6 || hour > 11) {
            container.innerHTML = `<p>Aktif genel duyuru bulunmuyor. Özel kupon kodlarınızı aşağıya girebilirsiniz.</p>`;
        }
    }

    function addToCart(name, price) {
        let item = cart.find(i => i.name === name);
        if (item) {
            item.qty++;
        } else {
            cart.push({ name, price, qty: 1 });
        }
        updateCart();
    }

    function applyCoupon() {
        const inputCode = document.getElementById('coupon-code').value.trim().toUpperCase();
        const msg = document.getElementById('coupon-msg');

        let found = activeCoupons.find(c => String(c.kod).toUpperCase() === inputCode);

        if (!found) {
            if (inputCode === "GUNAYDIN") found = { kod: "GUNAYDIN", indirimOrani: 15 };
            if (inputCode === "YILBASI") found = { kod: "YILBASI", indirimOrani: 25 };
        }

        if (found) {
            appliedDiscount = parseFloat(found.indirimOrani);
            appliedCouponName = found.kod;
            msg.style.color = "green";
            msg.innerText = `%${appliedDiscount} indirim uygulandı!`;
        } else {
            appliedDiscount = 0;
            appliedCouponName = "";
            msg.style.color = "red";
            msg.innerText = "Geçersiz kupon kodu.";
        }
        updateCart();
    }

    function updateCart() {
        const container = document.getElementById('cart-items');
        let subtotal = 0;
        
        if (cart.length === 0) {
            container.innerHTML = 'Sepetiniz boş.';
            document.getElementById('total-price').innerText = "0";
            return;
        }

        container.innerHTML = '';
        cart.forEach(i => {
            subtotal += i.price * i.qty;
            container.innerHTML += `<div class="cart-item"><span>${i.name} x${i.qty}</span><b>${i.price * i.qty} TL</b></div>`;
        });

        let grandTotal = subtotal;
        if (appliedDiscount > 0) {
            grandTotal = subtotal - (subtotal * (appliedDiscount / 100));
        }

        document.getElementById('total-price').innerText = grandTotal.toFixed(2);
    }

    async function sendOrder() {
        const name = document.getElementById('cust-name').value;
        const address = document.getElementById('cust-addr').value;
        const total = document.getElementById('total-price').innerText;

        if (!name || cart.length === 0) return alert("Lütfen sepeti doldurun ve adınızı yazın.");

        const itemsStr = cart.map(i => `${i.name} (${i.qty} adet)`).join(', ');

        const orderData = {
            name: name,
            address: address,
            items: itemsStr,
            total: total + " TL",
            coupon: appliedCouponName ? appliedCouponName : "Kuponsuz"
        };

        alert("Siparişiniz alınıyor...");

        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
        });

        alert("Siparişiniz Başarıyla Alındı!");
        cart = [];
        appliedDiscount = 0;
        document.getElementById('cust-name').value = '';
        document.getElementById('cust-addr').value = '';
        document.getElementById('coupon-code').value = '';
        document.getElementById('coupon-msg').innerText = '';
        updateCart();
    }

    checkSeasonalEvents();
    loadNotifications();
</script>

</body>
</html>
